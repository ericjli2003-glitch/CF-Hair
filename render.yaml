# Render Blueprint for the CF Hair phone receptionist (voice-agent/).
# Render dashboard: New > Blueprint > pick this repository. Render reads this file, creates the
# service, and asks for every value marked `sync: false` (the secrets). Full steps:
# voice-agent/README.md, "Deploying".
#
# The website stays on Vercel. This service only answers phone calls.
services:
  - type: web
    name: cf-hair-voice
    runtime: docker
    # Oregon is Render's closest region to Coquitlam, which keeps the voice delay low.
    region: oregon
    # Starter is always on. The free plan sleeps after 15 idle minutes, and a sleeping server
    # cannot answer a phone call in time.
    plan: starter
    numInstances: 1
    dockerfilePath: ./voice-agent/Dockerfile
    # The build needs shared/salon.json, so the context is the repository root.
    dockerContext: .
    healthCheckPath: /health
    # A redeploy starts the new server first; the old one then gets up to 5 minutes for calls in
    # progress to finish (the app drains for DRAIN_TIMEOUT_MS, a little less than this).
    maxShutdownDelaySeconds: 300
    autoDeploy: true
    # Only phone-agent changes redeploy it, so website pushes never interrupt a call.
    buildFilter:
      paths:
        - voice-agent/**
        - shared/**
        - render.yaml
      ignoredPaths:
        - voice-agent/test/**
        - voice-agent/**/*.md
    # No persistent disk on purpose: a disk turns off zero-downtime deploys, so every deploy would
    # drop live calls. Caller languages, bookings and call records live in the website's database.
    envVars:
      # Claude: workload identity federation, no API key. Render's managed OIDC (Pro workspace)
      # gives the service a short-lived token and sets ANTHROPIC_IDENTITY_TOKEN_FILE itself once
      # ANTHROPIC_FEDERATION_RULE_ID is present; the SDK exchanges it and refreshes automatically.
      # Values come from Claude Console > Settings > Workload identity (README, "Deploying").
      # Without a Pro workspace: leave these three blank and add ANTHROPIC_API_KEY in the
      # dashboard instead (never add an empty ANTHROPIC_API_KEY next to federation).
      - key: ANTHROPIC_FEDERATION_RULE_ID
        sync: false
      - key: ANTHROPIC_ORGANIZATION_ID
        sync: false
      - key: ANTHROPIC_SERVICE_ACCOUNT_ID
        sync: false
      # Other secrets: Render asks for these when the Blueprint is created.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Must equal AGENT_API_KEY in the website's Vercel settings.
      - key: AGENT_API_KEY
        sync: false
      # ElevenLabs API key with Speech to Text permission: identifies a new caller's language from
      # their first sentence (Scribe v2 Realtime). Leave empty to turn it off.
      - key: ELEVENLABS_API_KEY
        sync: false
      # Languages spoken by ElevenLabs directly with Eleven v4 Turbo, for example zh-HK (Cantonese).
      # Needs CR_ZH_HK_VOICE set to an ElevenLabs voice id, and Text to Speech on the key above.
      - key: ELEVENLABS_DIRECT_LANGUAGES
        sync: false
      # Speech-to-speech test line (OpenAI Realtime) on a second Twilio number, webhook /s2s/twiml.
      # OpenAI login without a key: Render's managed OIDC sets OPENAI_IDENTITY_TOKEN_FILE once these
      # two are present (README, "Speech-to-speech test line"). Leave all empty to turn the line off.
      - key: OPENAI_IDENTITY_PROVIDER_ID
        sync: false
      - key: OPENAI_SERVICE_ACCOUNT_ID
        sync: false
      # Azure Voice Live test line (webhook /azure/twiml): the Azure AI Foundry endpoint and key.
      - key: AZURE_VOICELIVE_ENDPOINT
        sync: false
      - key: AZURE_VOICELIVE_API_KEY
        sync: false
      # MiniMax voices (Mandarin by default) on the Azure line.
      - key: MINIMAX_API_KEY
        sync: false
      # The owner's mobile or a second line in E.164, never the salon's main number.
      # Leave empty to turn live transfers off (callers can still leave a message).
      - key: SALON_FORWARD_NUMBER
        sync: false
      # Settings
      - key: BOOKING_API_URL
        value: https://cf-hair-salon.vercel.app
      - key: SALON_MAIN_NUMBER
        value: "+16044757705"
      # Set in the dashboard (claude-sonnet-5-5 if unset). sync: false so a dashboard change, for
      # example claude-haiku-4-5 for faster replies, is not reset by the next Blueprint sync.
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_EFFORT
        value: low
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"
      - key: MOCK_API
        value: "false"
      - key: CALL_SUMMARY
        value: "on"
      - key: DRAIN_TIMEOUT_MS
        value: "280000"
      # PUBLIC_BASE_URL is not needed: the app uses Render's RENDER_EXTERNAL_URL
      # (https://cf-hair-voice.onrender.com). Set it only if you add a custom domain.
